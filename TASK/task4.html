<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

.dashboard{
    display:flex;
    height:100vh;
}

.sidebar{
    width:220px;
    background:#1e293b;
    color:white;
    padding:20px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    padding:15px;
    margin-top:10px;
    background:#334155;
    border-radius:6px;
    cursor:pointer;
}

.sidebar li:hover{
    background:#2563eb;
}

.main{
    flex:1;
    background:#f5f5f5;
    padding:20px;
}

.header{
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    text-align:center;
}

.table-section{
    margin-top:40px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:15px;
    border:1px solid #ddd;
}

th{
    background:#2563eb;
    color:white;
}
</style>
<body>
<div class="dashboard">

    <aside class="sidebar">
        <h2>Dashboard</h2>

        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Products</li>
            <li>Orders</li>
            <li>Settings</li>
        </ul>
    </aside>

    <main class="main">

        <header class="header">
            <h2>Dashboard Overview</h2>
        </header>

        <section class="cards">

            <div class="card">
                <h3>Users</h3>
                <p>1245</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <p>356</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>789</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>₹2,45,000</p>
            </div>

        </section>

        <section class="table-section">

            <table>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>#1001</td>
                    <td>Raj</td>
                    <td>10 Aug</td>
                    <td>₹1200</td>
                    <td>Delivered</td>
                </tr>

            </table>

        </section>

    </main>

</div>

</body>
</html>
