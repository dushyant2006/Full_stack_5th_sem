<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    text-align:center;
}

.container h2{
    margin-bottom:20px;
    color:#0b2d7c;
}

.container input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

.container button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#0b2d7c;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}
label{
    display: block;
    text-align: left;
    margin-bottom: 8px;
    font-size: 20px;
    font-weight: bold;
}

.container button:hover{
    background:#061d5e;
}
</style>

</head>

<body>

<div class="container">
    <h2>Login</h2>

    <form>
        <label for="username">Username</label>
        <input type="text" placeholder="Username" required>
        <label for="password">Password</label>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
