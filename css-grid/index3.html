    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:500px;
            width:500px;
            display:grid;
            outline:1px solid black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            background-color: grey;
        }
        .container>div{
            font-size: 30px;
          outline:1px solid black;
        }

        }
        #box6{
            background-color:grey;
            grid-column-start:2;
            grid-column-end:3;

            grid-row-end:3;
            z-index: 2;
        } */
        .parent{
            --primary-color:black;
            display:grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            background-color: blue;
            grid-column: 1/3;
            grid-row: 1/3;
        }
        .child{

            background-color: var(--primary-color);
            color:white;
            grid-column: 2/3;
            grid-row: 2/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                <div>1</div>
                <div></div>
            </div>
        </div>
