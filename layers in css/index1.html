<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer base, special, morespecial;
        @layer base{
            .para{
                font-size: 30px;
                color: red;
                background-color: yellow;
            }
        }
        @layer special{
            .highlight-para{
                font-size:45px;
                color: blue;
                background-color: green;
                border: 2px solid pink;
            }
            
            }
        
    </style>
</head>
<body>

   <p class="highlight-para">Hello World !.</p>
</body>
</html>
