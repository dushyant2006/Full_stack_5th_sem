
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Boxes</title>

    <style>
        .box {
            width: 350px;
            height: 250px;
            color: white;
            font-weight: 900;
            font-size: 30px;
            text-align: center;
            position: sticky;
        }

        .box p {
            margin: 0;
            padding: 0;
        }

        #box1 {
            background: black;
            top: 0;
        }

        #box2 {
            background: blue;
            top: 50px;
        }

        #box3 {
            background: green;
            top: 100px;
        }

        #box4 {
            background: orange;
            top: 150px;
        }

        #box5 {
            background: red;
            top: 200px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box" id="box1">
            <p>Box 1</p>
        </div>

        <div class="box" id="box2">
            <p>Box 2</p>
        </div>

        <div class="box" id="box3">
            <p>Box 3</p>
        </div>

        <div class="box" id="box4">
            <p>Box 4</p>
        </div>

        <div class="box" id="box5">
            <p>Box 5</p>
        </div>

    </div>

</body>
</html>
