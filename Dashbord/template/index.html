<!DOCTYPE html>
<html>

<head>
    <title>3 German Supremacy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            font-family: Arial;
        }

        .heading {
            height: 100vh;
            color: white;
            display: flex;
           justify-content: center;
            align-items: center;
            text-align: left;
        }

        .heading h1 {
            font-size: 70px;
        }

        
        .cars {
            height: 100vh;
            top: 0;
            display: flex;
            overflow-x: auto;
           

            
        }

        .box {
            min-width: 100vw;
            height: 100vh;

            position: relative;

            scroll-snap-align: start;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box h2 {
            position: absolute;

            top: 25%;
            left: 28%;


            color: white;
            font-size: 60px;
            text-align: center;
        }

    
    </style>
</head>

<body>

    <section class="heading">
        <h1>3 GERMAN<br>SUPREMACIES</h1>
    </section>

    <section class="cars">

        <div class="box">
            <img src="download (5).jpg">
            <h2>PORSCHE<br>GT3 RS</h2>
        </div>

        <div class="box">
            <img src="download (6).jpg">
            <h2>PORSCHE<br>911</h2>
        </div>

        <div class="box">
            <img src="Mercedes-Benz AMG One 2024.jpg">
            <h2>MERCEDES<br>AMG ONE</h2>
        </div>

    </section>

</body>

</html>
