<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         * {
        margin: 0;
        padding: 0;
    
        }
        .slider {
            width: 100vw;
            overflow:scroll;
            scrollbar-width: none;
            display: inline-flex;
     
        }
        .item {
           min-width: 100vw;
            height: 600vh;
            position:sticky;
            left: 0;
            font-size: 50px;
            color: white;
            -webkit-text-stroke-width: 2px;
            text-align: center;
        }
       
    </style>
</head>
<body>
    <div class = "slider">
        <div class="item" style="background-color: blue;">1</div>
       <div class="item" style="background-color: black;">2</div>
       <div class="item" style="background-color: aqua;">3</div>
       <div class="item" style="background-color: red;">4</div>
       <div class="item" style="background-color: magenta;">5</div>

        </div>
    </div>
</body>
</html>
