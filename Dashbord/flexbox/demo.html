<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
              height: 90vh;
              outline: 3px solid black;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .container > div {
            
            color: white;
            width:150px;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1{
            background-color: yellow;
        }
        #box2{
        background-color: green;
        }
        #box3{
            background-color: red;
        }
        #box4{
            background-color: blue;
        }
        #box5{
            background-color: orange;
        }
        #box6{
            background-color: purple;
        }
        #box7{
            background-color: brown;
        }
        #box8{
            background-color: pink;
        }
        #box9{
            background-color: gray;
        }
        #box10{
            background-color: aqua;
        }

        
    </style>
</head>

<body>

    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
        <div id="box7">7</div>
        <div id="box8">8</div>
        <div id="box9">9</div>
        <div id="box10">10</div>
    </div>

</body>
</html>
