<!--
Task 1: Create a login card and div in center by using flexbox -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 350px;
            height: 300px;
            background-color: pink;
            align-items: center;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 10px black;
            
        }
        .card h1{
            color: white;
            border-bottom: 2px solid aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Login</h1>
            <form action="">
                <input type="text" placeholder="username"><br/><br/>
                <input type="password" placeholder="Password"><br/><br/>
                <input type="submit" value="Login">
            </form>
        </div>
    </div>

</body>
</html>
