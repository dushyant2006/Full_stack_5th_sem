<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        /* parent child relationship */
        section h2{
            color:aqua;
        }
        /*all sibling */
        h2~p{
            color:yellow;
            font-size:40px;                                                            
        }
        section > h2{
            color:blue;
        }
        /* direct sibling */
        h2+p{
            font-size:30px;
            color:green;
            text-shadow: 0px 0px 3px black;
        }   
       
         
        
        
    </style>
</head>
<body>
    <section>
        <h2>Heading </h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <div>
            <h2>Heading</h2>
        </div>
    </section>
</body>
</html>
