<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            color:white;
            background-color:black;
            border-width:0px;
            font-size:40px;
            margin:3px;
        }
        button:not(:hover){
           
            box-shadow: 0px 3px 5px aqua;
        }
        button:active{
            box-shadow: 0px 0px 0px grey;
            background-color:grey;
          
        }
       button:focus{
            outline:3px solid red;
            
        }

       

       
    </style>
</head>
<body>
    
    <button>Click Me</button>
    <button>Click Me</button>
    <button>Click Me</button>
    
    
</body>
</html>
