<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clear None</title>

    <style>
        #div1, #div2, #div3, #div4, #div5 {
            height: 200px;
            width: 200px;
            float: left;
        }

        #div1 img, #div3 img, #div5 img {
            width: 200px;
            height: 200px;
        }

        #div2, #div4 {
            background-color: black;
            color: white;
        }

        #div2 {
            outline: 20px solid red;
        }
    </style>
</head>

<body>

    <div id="div1">
        <img src="https://i.pinimg.com/736x/be/11/63/be1163d5e5f9c12f2ea6c8dd2973ee8f.jpg" alt="Image">
        Div1
    </div>

    <div id="div2">
        Div2
    </div>

    <div id="div3">
        <img src="https://i.pinimg.com/736x/be/11/63/be1163d5e5f9c12f2ea6c8dd2973ee8f.jpg" alt="Image">
        Div3
    </div>

    <div id="div4">
        Div4
    </div>

    <div id="div5">
        <img src="https://i.pinimg.com/736x/be/11/63/be1163d5e5f9c12f2ea6c8dd2973ee8f.jpg" alt="Image">
        Div5
    </div>

</body>
</html>
